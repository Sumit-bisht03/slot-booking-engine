spring:
  application:
    name: slot-booking-engine

  # --- Database Configuration ---
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:slotify_db}
    username: ${DB_USER:slotify_user}
    password: ${DB_PASSWORD:slotify_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      connection-timeout: 3000

  # --- JPA & Hibernate Settings ---
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        hbm2ddl:
          auto: create

  # --- Redis Configuration ---
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # --- RabbitMQ Configuration ---
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:slotify_mq}
    password: ${RABBITMQ_PASSWORD:slotify_mq_password}
    listener:
      simple:
        retry:
          enabled: false
        default-requeue-rejected: true

server:
  port: ${PORT:8080}

app:
  outbox:
    fixed-delay-ms: 3000
    batch-size: 20

rabbitmq:
  exchange: booking.exchange
  queue: booking.events.queue
  routing-key: booking.event.key

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

springdoc:
  packages-to-scan: com.hackathon.slot_booking_engine.controller, com.hackathon.slot_booking_engine.dto
  paths-to-match: /api/**
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  api-docs:
    enabled: true
  show-actuator: false


logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.tool.schema: DEBUG