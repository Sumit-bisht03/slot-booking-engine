services:
  # -------------------------------------------------------------------
  # 0. Spring Boot Application
  # -------------------------------------------------------------------
  app:
    build: .
    container_name: slot-booking-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://slotify-postgres:5432/slotify_db
      - SPRING_DATASOURCE_USERNAME=slotify_user
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_DATA_REDIS_HOST=slotify-redis
      - SPRING_RABBITMQ_HOST=slotify-rabbitmq
      - SPRING_RABBITMQ_USERNAME=slotify_mq
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: "no"

  # -------------------------------------------------------------------
  # 1. PostgreSQL
  # -------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: slotify-postgres
    environment:
      POSTGRES_DB: slotify_db
      POSTGRES_USER: slotify_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U slotify_user -d slotify_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------
  # 2. Redis
  # -------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: slotify-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------
  # 3. RabbitMQ
  # -------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: slotify-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: slotify_mq
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: